server:
  port: ${PORT:8080}
  servlet:
    context-path: /api

spring:
  application:
    name: stayfinder-api
  datasource:
    url: jdbc:h2:mem:stayfinder;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  jackson:
    serialization:
      write-dates-as-timestamps: false

app:
  jwt:
    secret: ${JWT_SECRET:c3RheWZpbmRlci1kZW1vLXNlY3JldC1rZXktbXVzdC1iZS1sb25nLWVub3VnaC0yMDI2}
    expiration-ms: 86400000
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
  search:
    cache-size: 100

management:
  endpoints:
    web:
      exposure:
        include: health,info
